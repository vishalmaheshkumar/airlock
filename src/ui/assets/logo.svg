<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" role="img" aria-label="Hush">
  <title>Hush</title>
  <!-- Mark: sound bars descending into silence -->
  <g fill="none" stroke="#6b9080" stroke-width="2.6" stroke-linecap="round">
    <line x1="8"  y1="15" x2="8"  y2="33"/>
    <line x1="16" y1="18" x2="16" y2="30"/>
    <line x1="24" y1="22" x2="24" y2="26"/>
    <line x1="32" y1="24" x2="42" y2="24"/>
  </g>
  <!-- Wordmark -->
  <text x="54" y="31" font-family="Iowan Old Style, Charter, Georgia, serif" font-size="26" fill="#1a1c1a">hush</text>
</svg>
