<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Find</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="find">
    <div class="find-bar">
      <input id="q" type="text" placeholder="Find on page" autocomplete="off" spellcheck="false" />
      <span class="count" id="count">0/0</span>
      <button id="prev" title="Previous (⇧↩)" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button id="next" title="Next (↩)" aria-label="Next">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button id="close" title="Close (Esc)" aria-label="Close">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <script src="find.js"></script>
  </body>
</html>
