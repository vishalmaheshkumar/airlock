<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hush</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="tabstrip">
      <div id="brand" title="Hush">
        <!-- Hush mark: four bars descending into a flat line = sound going quiet -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4"  y1="7"  x2="4"  y2="17"/>
          <line x1="8.5" y1="9" x2="8.5" y2="15"/>
          <line x1="13" y1="11" x2="13" y2="13"/>
          <line x1="17" y1="12" x2="21" y2="12"/>
        </svg>
      </div>
      <div id="tabs"></div>
      <button id="newtab" title="New Tab (⌘T)">+</button>
    </div>
    <div id="toolbar">
      <button id="back" title="Back (⌘[)" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="forward" title="Forward (⌘])" aria-label="Forward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <button id="reload" title="Reload (⌘R)" aria-label="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15A9 9 0 1 1 18 5.3L23 10"/></svg>
      </button>
      <div class="address-wrap">
        <button id="engine-chip" class="engine-chip" aria-haspopup="true" aria-expanded="false" title="Search engine">
          <span id="engine-chip-label">DG</span>
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <input id="address" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false" />
      </div>
      <button id="star" title="Bookmark This Page (⌘D)" aria-label="Bookmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15 9 22 9.3 17 14 18.5 21 12 17.3 5.5 21 7 14 2 9.3 9 9 12 2"/></svg>
      </button>
      <button id="pip" class="text-btn" title="Picture-in-Picture">PiP</button>
      <button id="brain" title="Local SLM chat (⌘⇧L)" aria-label="Brain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3c-2 0-3.5 1.3-3.5 3 0 .6.2 1.1.5 1.5-1 .6-1.5 1.5-1.5 2.5 0 .9.5 1.7 1.2 2.2-.7.5-1.2 1.3-1.2 2.2 0 1 .6 1.9 1.5 2.4C5.7 17.5 5.5 18 5.5 18.5c0 1.5 1.3 2.8 3 2.8 1.3 0 2.4-.8 2.5-2V5c0-1.1-.9-2-2-2z"/>
          <path d="M15 3c2 0 3.5 1.3 3.5 3 0 .6-.2 1.1-.5 1.5 1 .6 1.5 1.5 1.5 2.5 0 .9-.5 1.7-1.2 2.2.7.5 1.2 1.3 1.2 2.2 0 1-.6 1.9-1.5 2.4.3.5.5 1 .5 1.5 0 1.5-1.3 2.8-3 2.8-1.3 0-2.4-.8-2.5-2V5c0-1.1.9-2 2-2z"/>
        </svg>
      </button>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
