<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hush — Brain</title>
    <link rel="stylesheet" href="brain.css" />
  </head>
  <body>
    <header class="brain-header">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M9 3c-2 0-3.5 1.3-3.5 3 0 .6.2 1.1.5 1.5-1 .6-1.5 1.5-1.5 2.5 0 .9.5 1.7 1.2 2.2-.7.5-1.2 1.3-1.2 2.2 0 1 .6 1.9 1.5 2.4C5.7 17.5 5.5 18 5.5 18.5c0 1.5 1.3 2.8 3 2.8 1.3 0 2.4-.8 2.5-2V5c0-1.1-.9-2-2-2z"/>
          <path d="M15 3c2 0 3.5 1.3 3.5 3 0 .6-.2 1.1-.5 1.5 1 .6 1.5 1.5 1.5 2.5 0 .9-.5 1.7-1.2 2.2.7.5 1.2 1.3 1.2 2.2 0 1-.6 1.9-1.5 2.4.3.5.5 1 .5 1.5 0 1.5-1.3 2.8-3 2.8-1.3 0-2.4-.8-2.5-2V5c0-1.1.9-2 2-2z"/>
        </svg>
        <h1>Brain</h1>
      </div>
      <div class="header-actions">
        <button id="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.63.86 1.04 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="close-btn" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
    </header>

    <section class="model-row">
      <label for="model-select" class="model-label">Model</label>
      <select id="model-select"></select>
      <button id="load-btn" class="primary">Load</button>
    </section>

    <section class="status">
      <div id="status-text">Pick a model and press Load to begin.</div>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <div class="hint">
        First load downloads the model (one-time; cached locally). Running local, no cloud.
      </div>
    </section>

    <section class="settings" id="settings-panel" hidden>
      <label>
        <span>System prompt</span>
        <textarea id="system-prompt" rows="3" placeholder="You are a helpful, concise assistant."></textarea>
      </label>
      <label class="row">
        <span>Temperature</span>
        <input id="temperature" type="range" min="0" max="1.5" step="0.05" value="0.6" />
        <output id="temperature-out">0.6</output>
      </label>
      <label class="row">
        <span>Max tokens</span>
        <input id="max-tokens" type="number" min="32" max="4096" step="32" value="512" />
      </label>
      <button id="reset-chat">Reset conversation</button>
    </section>

    <main class="messages" id="messages">
      <div class="placeholder">
        <p class="placeholder-title">Local models, locally.</p>
        <p class="placeholder-sub">Everything runs in this window via WebGPU. No request leaves your machine.</p>
      </div>
    </main>

    <footer class="composer">
      <div class="composer-stats" id="stats"></div>
      <div class="composer-row">
        <textarea id="input" placeholder="Message the model… (⌘↩ to send)" rows="1"></textarea>
        <button id="send-btn" class="primary" disabled>Send</button>
      </div>
    </footer>

    <script type="module" src="brain.js"></script>
  </body>
</html>
